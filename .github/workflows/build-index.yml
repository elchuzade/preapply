name: Build index

on:
  push:
    branches: [main]
    paths:
      - "data/accelerators/**"
      - "data/schema.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:index
      - name: Commit index.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          if git diff --cached --quiet; then
            echo "index.json is up to date"
          else
            git commit -m "chore: rebuild data/index.json"
            git push
          fi
      - name: Refresh the jsDelivr cache
        # jsDelivr caches @main for up to 12 hours; purge so the extension and website see changes right away.
        run: |
          for f in data/index.json $(git ls-files 'data/accelerators/*.yaml' 'data/accelerators/**/*.yaml'); do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || echo "Purge failed for $f"
          done
