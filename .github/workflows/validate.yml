name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "extension/src/lib/types.ts"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate accelerator files
        run: npm run validate
      - name: Unit tests
        run: npm test
