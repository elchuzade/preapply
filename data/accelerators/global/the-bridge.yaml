id: the-bridge
name: The Bridge Residency
country: global
website: https://www.join-thebridge.com/
status: verified
match:
  domains:
    - join-thebridge.com
  apply_urls:
    - "https://www.join-thebridge.com/apply*"
    - "https://apply.joinef.com/app/*thebridge*"
cohort: Winter (San Francisco)
last_verified: 2026-10-22
notes: >-
  Run by Entrepreneur First; the form is on EF's application site (apply.joinef.com).
  Contact details come first, then the full application.
  Step 2 counters read "100 of 100 left" — whether that counts words or characters is unverified.
  The form confirms the competitions question is required; the other required flags are inferred.
steps:
  - title: Contact details
    intro: >-
      Also asks you to accept EF's Privacy Policy and offers an optional EF newsletter sign-up.
      Clicking "Next" consents to EF contacting you through any channel you entered.
    questions:
      - text: First name
        required: true
        type: short_text
      - text: Last name
        required: true
        type: short_text
      - text: Email address
        required: true
        type: short_text
      - text: Phone number
        hint: With country code.
        required: true
        type: short_text
      - text: LinkedIn profile URL
        hint: If you do not have a LinkedIn profile, please provide a URL for your personal website.
        required: true
        type: url

  - title: Your achievements
    intro: >-
      An 8-week residency in the Bay Area for Europe's next founders who are ready to start now.
      You don't need to have a cofounder or an idea to apply.
    questions:
      - text: Please record a one minute video introducing yourself. Do not pitch an idea or a CV. Help us understand why you are the next to build a generational company.
        hint: Please share a public link we can access (YouTube, Vimeo, Google Drive...).
        required: true
        type: video
      - text: Where did you learn what you know?
        hint: Let us know what university you attended, company you worked at, or mentor you worked with.
        required: true
        type: long_text
        limit: 100
        limit_unit: words # TODO verify unit
      - text: Have you participated in national or international competitions? List any competitions/awards you have won, or papers you've published.
        required: true
        type: long_text
        limit: 100
        limit_unit: words # TODO verify unit
      - text: What's a strong opinion you've held and acted on, even when smart people you respected told you were wrong? What happened?
        required: true
        type: long_text
        limit: 100
        limit_unit: words # TODO verify unit
      - text: Tell us about a time you got into a room you weren't invited to.
        hint: Why and how did you do it, and what did you do once you were inside?
        required: true
        type: long_text
        limit: 100
        limit_unit: words # TODO verify unit
      - text: "If you are technical: What's the most impressive product or project you've built or done?"
        required: false
        type: long_text
        limit: 200
        limit_unit: words # TODO verify unit
      - text: What is the most surprising discovery you've made, or found out about, using AI?
        required: true
        type: long_text
        limit: 100
        limit_unit: words # TODO verify unit
      - text: What's the most impressive commercial outcome you've driven or revenue you've earned? What was your role and contribution?
        required: true
        type: long_text
        limit: 100
        limit_unit: words # TODO verify unit
      - text: What do you think is the most undervalued commercial opportunity or most important problem to work on in the next 10 years?
        hint: How AI-native is your thinking about it - i.e., where does building with AI at the core (not bolted on) change the opportunity or the approach?
        required: true
        type: long_text
        limit: 200
        limit_unit: words # TODO verify unit
      - text: What are you obsessed with, and what has it made you a master of – or be on your way to mastering?
        required: true
        type: long_text
        limit: 100
        limit_unit: words # TODO verify unit
      - text: Who would be the 2 best references we should call that could speak to your attributes?
        hint: These should be people who know you personally, who've seen you excel in a work capacity, ideally one (if not both) is senior to you.
        required: true
        type: references
        limit: 100
        limit_unit: words # TODO verify unit
      - text: Are you applying with a co-founder? If so, make sure they fill out a separate application and please mention their name and how you split your roles.
        hint: "Note: we rarely offer pre-formed teams, we focus on individuals."
        required: true
        type: other
      - text: Co-founder's full name
        hint: Only if you're applying with a co-founder ("Please type their full name here").
        required: false
        type: short_text
      - text: If you applied to a previous cohort, what have you done since then?
        required: false
        type: long_text

  - title: About you
    intro: Ends with a second Privacy Policy acknowledgement.
    questions:
      - text: Where are you based?
        required: true
        type: short_text
      - text: What is your nationality?
        hint: Selected from a list.
        required: true
        type: choice
      - text: How did you first hear about The Bridge?
        hint: (Reached out, LinkedIn post, X post, event, alumni, referral, search, AI, etc.)
        required: true
        type: short_text
      - text: If we reached out to you, who's your point of contact from EF?
        required: false
        type: short_text
      - text: Who is the most impressive person you know who should start a technology company and apply?
        hint: Optional. EF is particularly keen to hear about people from groups that are underrepresented in tech.
        required: false
        type: short_text
      - text: Please share their LinkedIn or another professional URL (e.g. academic, or website).
        required: false
        type: url
      - text: Are you happy to hear from our alumni companies regarding other opportunities?
        required: true
        type: choice
